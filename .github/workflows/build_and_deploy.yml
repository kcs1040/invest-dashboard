name: Build Dashboard & Excel (daily)

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 08:00 KST = 23:00 UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install pandas numpy yfinance fredapi plotly openpyxl python-dotenv

      - name: Build Excel & Dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python invest_excel.py
          python invest_dashboard.py
          mkdir -p docs
          if [ -f dash_pro_perchart/index.html ]; then
            cp dash_pro_perchart/index.html docs/index.html
          else
            cp dash_pro/index.html docs/index.html
          fi
          mkdir -p docs/data_pro
          cp -f data_pro/Macro_Dashboard_Full_plus_Compact_PRO.xlsx docs/data_pro/

      - name: Deploy to GitHub Pages (gh-pages)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
